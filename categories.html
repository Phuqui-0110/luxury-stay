<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý danh mục | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="admin-overlay" id="adminOverlay" onclick="closeAdminSidebar()"></div>
  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="brand"><h4><i class="bi bi-building"></i> LUXURY STAY</h4><small style="color:rgba(255,255,255,0.5);">Admin Panel</small></div>
      <nav style="margin-top:12px;">
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="bookings.html"><i class="bi bi-calendar-check"></i> Quản lý đơn hàng</a>
        <a href="rooms.html"><i class="bi bi-door-open"></i> Quản lý phòng</a>
        <a href="users.html"><i class="bi bi-people"></i> Quản lý tài khoản</a>
        <a href="categories.html" class="active"><i class="bi bi-tags"></i> Quản lý danh mục</a>
        <hr style="border-color:rgba(255,255,255,0.1);margin:12px 16px;">
        <a href="../index.html"><i class="bi bi-box-arrow-left"></i> Về trang chủ</a>
        <a href="#" onclick="logout();return false;"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
      </nav>
    </aside>
    <div class="admin-content">
      <div class="admin-topbar">
        <button class="admin-toggle" onclick="toggleAdminSidebar()" aria-label="Menu"><i class="bi bi-list"></i></button>
        <h5 style="margin:0;font-weight:700;">Quản lý danh mục phòng</h5>
        <button class="btn btn-primary btn-sm" onclick="addCategory()"><i class="bi bi-plus"></i> Thêm danh mục</button>
      </div>
      <div class="admin-main">
        <div class="table-card">
          <table>
            <thead><tr><th>ID</th><th>Tên danh mục</th><th>Mô tả</th><th>Thao tác</th></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script>
    if (!requireAuth(['staff','admin'])) throw new Error('Không có quyền');
    const catFields = [
      { name: 'name', label: 'Tên danh mục', required: true },
      { name: 'description', label: 'Mô tả', type: 'textarea' }
    ];
    function dup(name, list, selfId) {
      return list.some(c => c.id !== selfId && c.name.toLowerCase() === name.toLowerCase());
    }
    function addCategory() {
      openForm('Thêm danh mục', catFields, {}, d => {
        const list = getCategories();
        if (!d.name) return 'Vui lòng nhập tên danh mục!';
        if (dup(d.name, list, null)) return 'Danh mục này đã tồn tại!';
        list.push({ id: nextId(list), name: d.name, description: d.description });
        saveCategories(list); render(); toast('Đã thêm danh mục');
      });
    }
    function editCategory(id) {
      const list = getCategories();
      const c = list.find(x => x.id === id);
      if (!c) return;
      openForm('Sửa danh mục #' + id, catFields, c, d => {
        if (!d.name) return 'Vui lòng nhập tên danh mục!';
        if (dup(d.name, list, id)) return 'Danh mục này đã tồn tại!';
        saveCategories(list.map(x => x.id === id ? { ...x, name: d.name, description: d.description } : x));
        // đổi tên danh mục thì cập nhật luôn loại của các phòng thuộc danh mục
        if (d.name !== c.name) saveRooms(getRooms().map(r => r.type === c.name ? { ...r, type: d.name } : r));
        render(); toast('Đã cập nhật danh mục');
      });
    }
    function delCategory(id) {
      const c = getCategories().find(x => x.id === id);
      if (!c) return;
      if (getRooms().some(r => r.type === c.name)) { alert('Còn phòng thuộc danh mục "' + c.name + '", không thể xóa!'); return; }
      if (!confirm('Xóa danh mục "' + c.name + '"?')) return;
      saveCategories(getCategories().filter(x => x.id !== id));
      render(); toast('Đã xóa danh mục');
    }
    function render() {
      document.getElementById('body').innerHTML = getCategories().map(c => `
        <tr>
          <td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.description)}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="editCategory(${c.id})" aria-label="Sửa"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-danger btn-sm" onclick="delCategory(${c.id})" aria-label="Xóa"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:#999;padding:30px;">Chưa có danh mục</td></tr>';
    }
    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
