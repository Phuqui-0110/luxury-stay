<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết phòng | Luxury Stay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand"><i class="bi bi-building"></i> LUXURY STAY</a>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu"><i class="bi bi-list"></i></button>
      <ul class="navbar-nav">
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="rooms.html" class="active">Phòng</a></li>
        <li><a href="cart.html">Giỏ đặt <span class="cart-badge">0</span></a></li>
        <li><a href="orders.html">Đơn của tôi</a></li>
        <li id="navAdmin" style="display:none;"><a href="admin/dashboard.html">Admin</a></li>
        <li id="navLogin"><a href="login.html" class="btn-gold"><i class="bi bi-person"></i> Đăng nhập</a></li>
        <li id="navUser" style="display:none;"></li>
      </ul>
    </div>
  </nav>

  <section class="section">
    <div id="detail" class="detail-grid"></div>
  </section>

  <footer class="footer"><div class="footer-bottom">&copy; 2026 Luxury Stay</div></footer>
  <script src="js/main.js"></script>
  <script>
    if (!requireAuth(['customer','staff','admin'])) throw new Error('Chưa đăng nhập');
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const id = parseInt(params.get('id'), 10);
      const r = getRooms().find(x => x.id === id);
      const box = document.getElementById('detail');
      if (!r) {
        box.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#999;">' +
          '<i class="bi bi-emoji-frown" style="font-size:3rem;"></i><p style="margin:10px 0;">Không tìm thấy phòng này.</p>' +
          '<a href="rooms.html" class="btn btn-primary">Xem danh sách phòng</a></div>';
        return;
      }
      const today = todayStr();
      const canBook = r.status === 'available';
      box.innerHTML = `
        <div>
          <img src="${esc(r.image)}" onerror="this.onerror=null;this.src=FALLBACK_IMG" style="width:100%;border-radius:12px;height:360px;object-fit:cover;">
          <div style="background:#fff;border-radius:12px;padding:24px;margin-top:16px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
            <h2>${esc(roomTitle(r))}</h2>
            <p style="color:#666;margin:12px 0;">${esc(r.desc)}</p>
            <div class="amenities" style="margin-top:12px;">
              ${String(r.amenities || '').split(',').filter(a => a.trim()).map(a => `<span><i class="bi bi-check-circle"></i> ${esc(a.trim())}</span>`).join('')}
            </div>
            <p style="margin-top:12px;color:#888;">Sức chứa: <strong>${esc(r.capacity)} người</strong> · Diện tích: <strong>${esc(r.area)}m²</strong> · Tầng: <strong>${esc(r.floor)}</strong></p>
          </div>
        </div>
        <div style="background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,0.08);height:fit-content;position:sticky;top:80px;">
          <div class="price" style="font-size:1.8rem;margin-bottom:20px;">${formatPrice(r.price)}<span style="font-size:0.9rem;font-weight:400;color:#888;">/đêm</span></div>
          ${canBook ? '' : `<p style="color:#dc3545;font-weight:600;margin-bottom:14px;">Phòng hiện không nhận đặt (${esc(ROOM_STATUS[r.status] || r.status)}).</p>`}
          <div class="form-group"><label>Ngày nhận phòng</label><input type="date" id="checkin" min="${today}" ${canBook ? '' : 'disabled'}></div>
          <div class="form-group"><label>Ngày trả phòng</label><input type="date" id="checkout" min="${addDays(today, 1)}" ${canBook ? '' : 'disabled'}></div>
          <div id="priceInfo" style="background:#f8f9fa;border-radius:8px;padding:14px;margin:14px 0;display:none;">
            <div style="display:flex;justify-content:space-between;"><span>Số đêm</span><span id="nights">0</span></div>
            <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem;color:#0d6efd;margin-top:6px;"><span>Tổng</span><span id="total">0đ</span></div>
          </div>
          <button class="btn btn-primary btn-lg" style="width:100%;" onclick="doAdd(${r.id})" ${canBook ? '' : 'disabled'}>
            <i class="bi bi-cart-plus"></i> Thêm vào giỏ đặt
          </button>
        </div>
      `;
      const cin = document.getElementById('checkin');
      const cout = document.getElementById('checkout');
      function calc() {
        const box2 = document.getElementById('priceInfo');
        if (datesValid(cin.value, cout.value)) {
          const n = calcNights(cin.value, cout.value);
          box2.style.display = 'block';
          document.getElementById('nights').textContent = n + ' đêm';
          document.getElementById('total').textContent = formatPrice(n * r.price);
        } else {
          box2.style.display = 'none';
        }
      }
      cin.onchange = () => {
        cout.min = addDays(cin.value || today, 1);
        if (cout.value && cout.value <= cin.value) cout.value = '';
        calc();
      };
      cout.onchange = calc;
      // Điền sẵn ngày nếu đi từ trang tìm kiếm
      const pci = params.get('checkin'), pco = params.get('checkout');
      if (canBook && datesValid(pci, pco) && pci >= today) { cin.value = pci; cout.min = addDays(pci, 1); cout.value = pco; calc(); }
    });
    function doAdd(id) {
      const cin = document.getElementById('checkin').value;
      const cout = document.getElementById('checkout').value;
      addToCart(id, cin, cout);
    }
  </script>
</body>
</html>
