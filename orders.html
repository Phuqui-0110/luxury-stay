<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn đặt của tôi | Luxury Stay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand"><i class="bi bi-building"></i> LUXURY STAY</a>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu"><i class="bi bi-list"></i></button>
      <ul class="navbar-nav">
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="rooms.html">Phòng</a></li>
        <li><a href="cart.html">Giỏ đặt <span class="cart-badge">0</span></a></li>
        <li><a href="orders.html" class="active">Đơn của tôi</a></li>
        <li id="navAdmin" style="display:none;"><a href="admin/dashboard.html">Admin</a></li>
        <li id="navLogin"><a href="login.html" class="btn-gold"><i class="bi bi-person"></i> Đăng nhập</a></li>
        <li id="navUser" style="display:none;"></li>
      </ul>
    </div>
  </nav>

  <section class="section">
    <div class="section-title"><h2>Đơn đặt của tôi</h2></div>
    <div id="empty" style="display:none;text-align:center;padding:50px;color:#999;">
      <i class="bi bi-journal-x" style="font-size:3rem;"></i>
      <p style="margin-top:10px;">Chưa có đơn đặt nào</p>
      <a href="rooms.html" class="btn btn-primary" style="margin-top:12px;">Đặt phòng ngay</a>
    </div>
    <div id="list"></div>
  </section>

  <footer class="footer"><div class="footer-bottom">&copy; 2026 Luxury Stay</div></footer>
  <script src="js/main.js"></script>
  <script>
    if (!requireAuth(['customer','staff','admin'])) throw new Error('Chưa đăng nhập');
    const statusMap = {
      pending: ['Chờ xác nhận','badge-pending'],
      confirmed: ['Đã xác nhận','badge-confirmed'],
      checkedin: ['Đang ở','badge-checkedin'],
      checkedout: ['Đã trả','badge-checkedout'],
      cancelled: ['Đã hủy','badge-cancelled']
    };
    const payMap = { cash: 'Tiền mặt', bank: 'Chuyển khoản', momo: 'MoMo', vnpay: 'VNPay', paypal: 'PayPal' };
    function render() {
      const me = getUser();
      const orders = getOrders().filter(o => o.userId === me.id); // chỉ xem đơn của chính mình
      if (!orders.length) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('list').innerHTML = '';
        return;
      }
      document.getElementById('empty').style.display = 'none';
      document.getElementById('list').innerHTML = orders.map(o => {
        const [label, cls] = statusMap[o.status] || statusMap.pending;
        return `<div style="background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,0.05);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;">
            <div><strong style="font-size:1.1rem;">${esc(o.code)}</strong> <span style="color:#999;margin-left:10px;">${esc(o.date)}</span></div>
            <span class="badge ${cls}">${label}</span>
          </div>
          <div style="color:#666;font-size:0.9rem;margin-bottom:8px;">
            ${o.items.map(i => esc(i.name) + ' (' + esc(i.checkin) + ' → ' + esc(i.checkout) + ', ' + esc(i.nights) + ' đêm)').join('<br>')}
          </div>
          <div style="color:#888;font-size:0.85rem;margin-bottom:8px;">
            Thanh toán: ${esc(payMap[o.payment] || o.payment)} ·
            <span class="badge ${o.paymentStatus === 'paid' ? 'badge-paid' : 'badge-unpaid'}">${o.paymentStatus === 'paid' ? 'Đã thanh toán' : 'Chưa thanh toán'}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong style="color:#0d6efd;font-size:1.15rem;">${formatPrice(o.total)}</strong>
            ${o.status === 'pending' ? `<button class="btn btn-danger btn-sm" data-code="${esc(o.code)}" onclick="cancelOrder(this.dataset.code)"><i class="bi bi-x-circle"></i> Hủy đơn</button>` : ''}
          </div>
        </div>`;
      }).join('');
    }
    function cancelOrder(code) {
      if (!confirm('Hủy đơn ' + code + '?')) return;
      const me = getUser();
      const orders = getOrders().map(o =>
        (o.code === code && o.userId === me.id && o.status === 'pending') ? { ...o, status: 'cancelled' } : o);
      saveOrders(orders);
      render();
      toast('Đã hủy đơn ' + code);
    }
    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
